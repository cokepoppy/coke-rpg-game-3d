name: Deploy GitHub Pages

on:
  push:
    branches:
      - codex/map-menu-sprite-polish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static artifact
        run: |
          mkdir -p dist
          cp index.html index.modular.html styles.modular.css dist/
          cp sprite-studio.html sprite-studio.css sprite-studio.js dist/
          cp -R src assets maps dist/
          find dist -name ".DS_Store" -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

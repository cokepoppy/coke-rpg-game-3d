<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprite Animation Inspector</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./sprite-studio.css" />
  </head>
  <body>
    <main class="studio-shell inspector-mode">
      <section class="hero-panel">
        <div class="brand-row">
          <span class="mark">S</span>
          <div>
            <strong>Sprite Animation Inspector</strong>
            <span>AI Sheet → Clean Frames → QA Playback</span>
          </div>
        </div>
        <h1>人物动画检查器</h1>
        <p>用独立播放器检查四方向行走或攻击帧：放大播放、逐帧查看、显示主体框、原始透明框、脚底线和残留像素。这个页面用于 AI 自动验收，也方便人工看问题。</p>

        <div class="asset-list" id="assetButtons">
          <button data-src="./assets/characters/hero/hero-attack-runtime-v1.png" data-name="Hero attack runtime" data-motion="attack" data-report="./assets/characters/hero/hero-attack-anchored-pass2-v1.json">主角攻击</button>
          <button data-src="./assets/hero-walk-sheet-anchored.png" data-name="Anchored hero sheet" class="active">锚点版</button>
          <button data-src="./assets/hero-walk-sheet-audited.png" data-name="Audited cleaned sheet">清理版</button>
          <button data-src="./assets/hero-walk-sheet-normalized.png" data-name="Normalized sheet">旧归一化</button>
          <button data-src="./assets/hero-walk-sheet.png" data-name="Raw alpha sheet">原始 Sheet</button>
        </div>

        <label class="file-button wide">
          导入 PNG Sheet
          <input id="fileInput" type="file" accept="image/png,image/webp,image/jpeg" />
        </label>

        <div class="metrics">
          <div><span>Source</span><b id="sourceMetric">-</b></div>
          <div><span>Cell</span><b id="cellMetric">-</b></div>
          <div><span>Residue</span><b id="residueMetric">-</b></div>
          <div><span>Max Drift</span><b id="driftMetric">-</b></div>
          <div><span>Anchor QA</span><b id="anchorMetric">-</b></div>
        </div>

        <ol id="pipelineLog"></ol>
      </section>

      <section class="preview-panel">
        <div class="panel-head">
          <div>
            <span>Playback</span>
            <strong id="previewTitle">四方向动画播放</strong>
          </div>
          <div class="segmented" id="directionButtons">
            <button data-dir="down" class="active">下</button>
            <button data-dir="left">左</button>
            <button data-dir="right">右</button>
            <button data-dir="up">上</button>
          </div>
        </div>
        <div class="stage">
          <canvas id="previewCanvas" width="448" height="448"></canvas>
        </div>
        <div class="controls">
          <label>FPS <input id="fps" type="range" min="1" max="16" value="8" /></label>
          <label>Zoom <input id="scale" type="range" min="2" max="8" value="5" /></label>
          <label><input id="showBody" type="checkbox" checked /> 主体框</label>
          <label><input id="showAll" type="checkbox" checked /> 原始框</label>
          <label><input id="showResidue" type="checkbox" checked /> 残留</label>
          <label><input id="showFoot" type="checkbox" checked /> 脚底线</label>
          <label><input id="showAnchor" type="checkbox" checked /> 锚点</label>
        </div>
      </section>

      <section class="inspector-panel">
        <div class="panel-head">
          <div>
            <span>Frame QA</span>
            <strong>单帧与整表检查</strong>
          </div>
          <div class="frame-stepper">
            <button id="prevFrame">上一帧</button>
            <b id="frameLabel">down 0</b>
            <button id="nextFrame">下一帧</button>
          </div>
        </div>
        <div class="frame-detail">
          <canvas id="frameCanvas" width="448" height="448"></canvas>
          <div class="frame-report" id="frameReport"></div>
        </div>
        <canvas id="sheetCanvas" width="512" height="512"></canvas>
      </section>
    </main>
    <script src="./sprite-studio.js" defer></script>
  </body>
</html>

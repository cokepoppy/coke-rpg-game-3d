<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111820" />
    <title>沈临川 · 3D动作查看器</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./threejs/character-viewer.css" />
  </head>
  <body>
    <main class="viewer-app">
      <canvas id="character-canvas" aria-label="沈临川3D动作预览"></canvas>
      <header class="viewer-topbar">
        <a class="back-link" href="./threejs-rpg.html">← 返回游戏</a>
        <div class="viewer-title"><span>动作实验室</span><strong>沈临川 · 3D角色查看器</strong></div>
        <span class="source-state"><i></i>裤装版 · 混元 3.1 + Blender 动作</span>
      </header>

      <aside class="control-panel">
        <div class="panel-kicker">ANIMATION INSPECTOR</div>
        <h1>动作检查</h1>
        <p class="panel-copy">选一个动作，拖动时间轴逐帧看步幅、抬脚和摆臂。拖动画面可绕角色旋转，滚轮缩放。</p>

        <div class="clip-title"><span>动作片段</span><small id="clip-count">载入中</small></div>
        <div class="clip-grid" id="clip-list"></div>

        <div class="timeline-head"><span>相位</span><b id="frame-label">帧 1 / 1</b></div>
        <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="动作相位" />
        <div class="timeline-marks"><span>起步</span><span>支撑</span><span>换脚</span><span>循环</span></div>

        <div class="playback-row">
          <button id="play-toggle" class="primary-button" type="button">❚❚ 暂停</button>
          <label for="speed"><span>播放速度</span><b id="speed-label">1.0×</b></label>
        </div>
        <input id="speed" type="range" min="0.45" max="1.5" step="0.05" value="1" aria-label="播放速度" />

        <div class="view-title">观察方向</div>
        <div class="view-presets" role="group" aria-label="观察方向">
          <button type="button" data-view="front">正面</button>
          <button type="button" data-view="threequarter" class="selected">斜前</button>
          <button type="button" data-view="side">侧面</button>
          <button type="button" data-view="back">背面</button>
        </div>

        <div class="model-status-card">
          <span class="status-dot"></span><div><strong id="model-status">正在载入角色 GLB</strong><small id="model-detail">动作数据读取中</small></div>
        </div>
        <a class="demo-link" href="./threejs-rpg.html?demo=1">观看剧情演示 <span>↗</span></a>
      </aside>

      <aside class="reference-panel">
        <div class="reference-heading"><span>新比例参考</span><small>ImageGen · Hunyuan 3.1 输入</small></div>
        <img src="./assets/generated/hunyuan-references/shen-linchuan-pants-reference-v2.png" alt="沈临川三头身比例、A Pose 短上衣分腿裤装概念图" />
        <p>腰长短衫 · 独立裤腿 · 绑腿长靴</p>
        <small>当前模型由这张比例修正版图经混元 3.1 生成；Blender 负责统一比例、网格预算、蒙皮与五段动作。</small>
      </aside>

      <div class="viewer-hint"><kbd>拖动</kbd> 旋转角色 <kbd>滚轮</kbd> 缩放 <span id="viewer-error" hidden></span></div>
    </main>
    <script type="module" src="./threejs/character-viewer.js"></script>
  </body>
</html>
